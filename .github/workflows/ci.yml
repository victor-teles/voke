name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # With no bun-version input, setup-bun reads the "packageManager" field in
      # package.json, so the pinned Bun version lives in one place.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
