service: rest-api-service

provider:
  name: aws
  runtime: nodejs20.x
  stage: prod
  region: sa-east-1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
      Resource: arn:aws:dynamodb:sa-east-1:123456789012:table/users

plugins:
  - serverless-offline

functions:
  createUser:
    handler: src/functions/create-user.handler
    events:
      - http:
          method: post
          path: /users
